services:
  - type: web
    name: convoc-clothing
    env: docker
    plan: free
    region: singapore # Closest region to India for fast load times
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:THlbmCzNhOMTo7bcXAWszd1mrTP01EunfePqkrfgPK4=
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
